name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '27.1'
          - '28.1'
          - '29.1'
          - 'snapshot'
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: emacs-eldev/setup-eldev@v1

      - name: Run tests
        run: eldev test

      - name: Lint
        run: eldev lint

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Instrumented (edebug) runs are 10 to 20 times slower on Emacs 29 than on
      # a current Emacs, so coverage runs on the newest one.
      - uses: purcell/setup-emacs@master
        with:
          version: 'snapshot'

      - uses: emacs-eldev/setup-eldev@v1

      # Fails the build if total line coverage drops below the floor.  Coverage is
      # edebug-based (undercover) and slightly under-reports functions with a
      # computed `interactive' spec, so the floor is deliberately conservative.
      - name: Coverage
        run: scripts/coverage.sh --min 95

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

