    - When new trunk/sample files appear, map them in trunk_coverage_matrix or mark as non-feature input.
    - Keep feature IDs stable; docs and tasks may link to them.
  validation_targets:
    - future.yml parses as YAML.
    - every features[].id is unique.
    - every trunk_coverage_matrix covered_by reference points to a feature or implemented coverage item.
    - eldev lint, compile, test, package, and doctor remain green.

